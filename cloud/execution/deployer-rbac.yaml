# One-time bootstrap by a cluster administrator. CI cannot grant itself access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: awfl-execution-namespace-reader
rules:
  - apiGroups: ['']
    resources: [namespaces]
    resourceNames: [awfl-execution]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: awfl-execution-namespace-reader
subjects:
  - kind: User
    name: github-deployer@awfl-us.iam.gserviceaccount.com
roleRef:
  kind: ClusterRole
  name: awfl-execution-namespace-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: execution-deployer
  namespace: awfl-execution
rules:
  - apiGroups: ['']
    resources: [serviceaccounts, resourcequotas]
    verbs: [get, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: execution-deployer
  namespace: awfl-execution
subjects:
  - kind: User
    name: github-deployer@awfl-us.iam.gserviceaccount.com
roleRef:
  kind: Role
  name: execution-deployer
  apiGroup: rbac.authorization.k8s.io
