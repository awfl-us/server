name: Relay expired-event replay regression
on:
  pull_request:
    paths:
      - 'workflows/events/**'
      - '.github/workflows/test-relay-expired-replay.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test workflows/events/replayFreshness.test.js
