name: Storage pilot contract and Terraform checks
on:
  push:
    branches: [main]
    paths:
      - 'storage/pilot/**'
      - 'storage/postgres/**'
      - 'test/storage/**'
      - 'scripts/benchmarks/**'
      - 'infra/storage-benchmark/**'
      - '.github/workflows/test-storage-pilot.yml'
  pull_request:
    paths:
      - 'storage/pilot/**'
      - 'storage/postgres/**'
      - 'test/storage/**'
      - 'scripts/benchmarks/**'
      - 'infra/storage-benchmark/**'
      - '.github/workflows/test-storage-pilot.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: benchmark-ci
          POSTGRES_USER: benchmark-ci
          POSTGRES_DB: benchmark_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmark-ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client for real integration test
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test execution-state contract and mocked adapters plus real PostgreSQL concurrency
        env:
          PGTEST_URL: postgres://benchmark-ci:benchmark-ci@127.0.0.1:5432/benchmark_ci
        run: node --test --test-concurrency=1 test/storage/*.test.mjs
      - name: Benchmark old global-cursor vs scoped-streams on same PostgreSQL service
        env:
          PGTEST_URL: postgres://benchmark-ci:benchmark-ci@127.0.0.1:5432/benchmark_ci
          PG_BENCH_PER_WORKER: '24'
        run: |
          psql "$PGTEST_URL" -v ON_ERROR_STOP=1 -f test/storage/fixtures/postgres-global-cursor.sql
          PG_BENCH_LABEL=legacy-global-cursor node scripts/benchmarks/postgresDocumentContention.mjs
          psql "$PGTEST_URL" -v ON_ERROR_STOP=1 -f storage/postgres/migrations/001_scoped_event_streams.sql
          PG_BENCH_LABEL=scoped-streams node scripts/benchmarks/postgresDocumentContention.mjs
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - name: Validate benchmark Terraform (no credentials or state access required)
        working-directory: infra/storage-benchmark
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
