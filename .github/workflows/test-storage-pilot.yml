name: Storage pilot contract and Terraform checks
on:
  push:
    branches: [main]
    paths:
      - 'storage/pilot/**'
      - 'test/storage/**'
      - 'scripts/benchmarks/**'
      - 'infra/storage-benchmark/**'
      - '.github/workflows/test-storage-pilot.yml'
  pull_request:
    paths:
      - 'storage/pilot/**'
      - 'test/storage/**'
      - 'scripts/benchmarks/**'
      - 'infra/storage-benchmark/**'
      - '.github/workflows/test-storage-pilot.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test execution-state contract and mocked adapters
        run: node --test test/storage/*.test.mjs
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - name: Validate benchmark Terraform (no credentials or state access required)
        working-directory: infra/storage-benchmark
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
