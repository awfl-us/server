name: Deploy to Cloud Run on Merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      MCP_OWNER_UID: ${{ vars.MCP_OWNER_UID }}
      GOOGLE_CLOUD_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_CLOUD_OAUTH_CLIENT_ID }}
      AWFL_CLI_REF: 'aceea9c616cc64ab5a2dd7880524e071b84645a0'
      CORS_ALLOW_ORIGIN: ${{ vars.CORS_ALLOW_ORIGIN }}
      # Default to repository variables; will be overridden by JSON if present
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      CLOUD_RUN_RUNTIME_SA: ${{ vars.CLOUD_RUN_RUNTIME_SA }}
      CLOUD_RUN_API_SERVICE: ${{ vars.CLOUD_RUN_API_SERVICE }}
      CLOUD_RUN_JOBS_SERVICE: ${{ vars.CLOUD_RUN_JOBS_SERVICE }}
      # Shared work bucket
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      # Pub/Sub topic (stable per env) used by producer/consumer
      PUBSUB_TOPIC: ${{ vars.PUBSUB_TOPIC }}
      # Optional stable Job names. If omitted, Jobs service/orchestrator can generate per-run/random job ids.
      PRODUCER_CLOUD_RUN_JOB_NAME: ${{ vars.PRODUCER_CLOUD_RUN_JOB_NAME }}
      CONSUMER_CLOUD_RUN_JOB_NAME: ${{ vars.CONSUMER_CLOUD_RUN_JOB_NAME }}
      # Proxy envs (optional). Also loaded from JSON if present.
      HTTP_PROXY: ${{ vars.HTTP_PROXY }}
      HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
      NO_PROXY: ${{ vars.NO_PROXY }}
      # Disable any gcloud interactive prompts in CI
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
      CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Load env from .github/actions-variables.json (if present)
        run: |
          set -euo pipefail
          FILE=".github/actions-variables.json"
          if [ -f "$FILE" ]; then
            echo "Loading variables from $FILE"
            jq -r 'to_entries[] | [.key, .value] | @tsv' "$FILE" | while IFS=$'\t' read -r key val; do
              printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
            done
          else
            echo "No $FILE found; using repository Variables"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate MCP protocol and authorization
        run: |
          npm install --ignore-scripts
          node --test mcp/tests/*.test.js
          node --test workflows/workspace/storageTokens.test.js

      - name: Authenticate to Google Cloud (WIF/OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}
          token_format: access_token

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: beta,gke-gcloud-auth-plugin,kubectl

      - name: Ensure gcloud beta component is installed (non-interactive)
        run: |
          set -euo pipefail
          gcloud components install beta --quiet
          # Sanity check to ensure beta is available and suppress any prompts
          gcloud --quiet beta --version > /dev/null || true

      - name: Configure gcloud
        run: |
          gcloud config set project "${GCP_PROJECT_ID}"
          gcloud config set run/region "${GCP_REGION}"

      # Deploy Firestore composite indexes using gcloud (WIF auth)
      - name: Deploy Firestore indexes (from firestore.indexes.json)
        if: ${{ hashFiles('firestore.indexes.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="firestore.indexes.json"
          if [[ ! -f "$FILE" ]]; then
            echo "No $FILE found; skipping Firestore indexes deploy"
            exit 0
          fi

          count=$(jq '.indexes | length' "$FILE")
          if [[ "$count" -eq 0 ]]; then
            echo "No composite indexes defined; skipping"
            exit 0
          fi

          # Iterate indexes and create via gcloud
          jq -c '.indexes[]' "$FILE" | while read -r idx; do
            collection=$(echo "$idx" | jq -r '.collectionGroup')
            scope=$(echo "$idx" | jq -r '.queryScope // "COLLECTION"')

            # Build repeated --field-config flags with correct keys
            mapfile -t fieldFlags < <(
              echo "$idx" | jq -r '
                .fields[] |
                if has("order") then
                  "--field-config=field-path=" + .fieldPath + ",order=" + .order
                else
                  "--field-config=field-path=" + .fieldPath + ",array-config=" + .arrayConfig
                end'
            )

            echo "Creating index for collectionGroup=${collection}, queryScope=${scope}"
            # shellcheck disable=SC2086
            gcloud --quiet beta firestore indexes composite create \
              --collection-group="${collection}" \
              --query-scope="${scope}" \
              ${fieldFlags[*]} \
              || echo "Index may already exist or is being built; continuing"
          done

      # Build --set-secrets flag from secrets.txt (Secret Manager keys listed one per line)
      - name: Build --set-secrets flag from secrets.txt
        id: secrets
        run: |
          set -euo pipefail
          # Cloud Run expects ENV=SECRET:VERSION in the deployment project.
          if [[ -f secrets.txt ]]; then
            secret_list=$(awk 'NF && $1 !~ /^#/ { print $1 "=" $1 ":latest" }' secrets.txt | paste -sd ',' -)
          else
            secret_list=''
          fi

          if [[ -n "${secret_list}" ]]; then
            echo "SECRET_FLAGS=--set-secrets=${secret_list}" >> "$GITHUB_OUTPUT"
          else
            echo "SECRET_FLAGS=" >> "$GITHUB_OUTPUT"
          fi

      # Configure Docker auth for Artifact Registry
      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      # Reuse source-addressed images across API-only deploys.
      # A missing tag (including the first run of this scheme) triggers a build.
      - name: Resolve Producer image
        id: producer_image
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD:cloud/producer)
          PRODUCER_IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/app/producer:source-${SOURCE_SHA}"
          echo "PRODUCER_IMAGE_URI=${PRODUCER_IMAGE_URI}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${PRODUCER_IMAGE_URI}" >/dev/null 2>&1; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "Reusing unchanged producer image: ${PRODUCER_IMAGE_URI}"
          else
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "Producer image missing or cannot be inspected; building: ${PRODUCER_IMAGE_URI}"
          fi

      - name: Build and push Producer image
        if: ${{ steps.producer_image.outputs.build_required == 'true' }}
        run: |
          set -euo pipefail
          PRODUCER_IMAGE_URI="${{ steps.producer_image.outputs.PRODUCER_IMAGE_URI }}"
          docker build \
            --build-arg HTTP_PROXY="${HTTP_PROXY}" \
            --build-arg HTTPS_PROXY="${HTTPS_PROXY}" \
            --build-arg NO_PROXY="${NO_PROXY}" \
            -t "${PRODUCER_IMAGE_URI}" cloud/producer
          docker push "${PRODUCER_IMAGE_URI}"

      # The consumer fingerprint includes the pinned AWFL CLI revision, even
      # when only that revision changes in this deployment workflow.
      - name: Resolve Consumer images
        id: consumer_images
        run: |
          set -euo pipefail
          SOURCE_SHA=$(printf '%s\n%s\n' "$(git rev-parse HEAD:cloud/sse-consumer)" "${AWFL_CLI_REF}" | sha256sum | cut -d' ' -f1)
          : > /tmp/awfl-consumer-build-profiles
          for profile in lightweight browser scala; do
            image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/app/sse-consumer-${profile}:source-${SOURCE_SHA}"
            echo "$(echo "${profile}" | tr '[:lower:]' '[:upper:]')_IMAGE_URI=${image}" >> "$GITHUB_OUTPUT"
            if docker manifest inspect "${image}" >/dev/null 2>&1; then
              echo "Reusing unchanged ${profile} consumer image: ${image}"
            else
              echo "${profile}" >> /tmp/awfl-consumer-build-profiles
            fi
          done
          echo "CONSUMER_IMAGE_URI=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/app/sse-consumer-lightweight:source-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Consumer images
        run: |
          set -euo pipefail
          while IFS= read -r profile; do
            image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/app/sse-consumer-${profile}:source-$(printf '%s\n%s\n' "$(git rev-parse HEAD:cloud/sse-consumer)" "${AWFL_CLI_REF}" | sha256sum | cut -d' ' -f1)"
            docker build \
              --target "${profile}" \
              --build-arg HTTP_PROXY="${HTTP_PROXY}" \
              --build-arg HTTPS_PROXY="${HTTPS_PROXY}" \
              --build-arg NO_PROXY="${NO_PROXY}" \
              --build-arg "AWFL_CLI_REF=${AWFL_CLI_REF}" \
              -t "${image}" cloud/sse-consumer
            docker push "${image}"
          done < /tmp/awfl-consumer-build-profiles

      # Verify each published image, not just Docker build success.
      - name: Verify Consumer image profiles
        env:
          LIGHTWEIGHT_IMG: ${{ steps.consumer_images.outputs.LIGHTWEIGHT_IMAGE_URI }}
          BROWSER_IMG: ${{ steps.consumer_images.outputs.BROWSER_IMAGE_URI }}
          SCALA_IMG: ${{ steps.consumer_images.outputs.SCALA_IMAGE_URI }}
        run: |
          set -euo pipefail
          docker run --rm "$LIGHTWEIGHT_IMG" sh -c 'command -v awfl && command -v git && command -v gcloud && ! command -v java && ! python -c "import playwright"'
          docker run --rm --shm-size=256m "$BROWSER_IMG" python -c '
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("data:text/html,<title>AWFL browser smoke</title>")
              assert page.title() == "AWFL browser smoke"
              browser.close()
          '
          docker run --rm "$SCALA_IMG" sh -c 'java -version && command -v sbt && ! python -c "import playwright"'

      # Artifact Registry's Image Streaming cache eliminates cold pulls after
      # image pushes. This is best-effort: a cache outage must not block deploy.
      - name: Prewarm consumer images for GKE Image Streaming
        env:
          LIGHTWEIGHT_IMG: ${{ steps.consumer_images.outputs.LIGHTWEIGHT_IMAGE_URI }}
          BROWSER_IMG: ${{ steps.consumer_images.outputs.BROWSER_IMAGE_URI }}
          SCALA_IMG: ${{ steps.consumer_images.outputs.SCALA_IMAGE_URI }}
        run: |
          set -euo pipefail
          REPO="projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/repositories/app"
          for profile in lightweight browser scala; do
            case "${profile}" in
              lightweight) image="${LIGHTWEIGHT_IMG}" ;;
              browser) image="${BROWSER_IMG}" ;;
              scala) image="${SCALA_IMG}" ;;
            esac
            tag="${image##*:}"
            payload="$(jq -nc \
              --arg tag "${REPO}/packages/sse-consumer-${profile}/tags/${tag}" \
              --arg region "${GCP_REGION}" \
              '{tag:$tag,retentionDays:"7",streamLocation:$region}')"
            if ! curl --fail-with-body --silent --show-error \
                --retry 3 --retry-all-errors --retry-delay 2 --max-time 45 \
                -X POST \
                -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "https://artifactregistry.googleapis.com/v1/${REPO}:prewarmArtifact" \
                -o "/tmp/awfl-consumer-prewarm-${profile}.json"; then
              echo "::warning::Image prewarming failed for ${profile}; the deployment can proceed"
            fi
          done

      # Create/replace Producer Cloud Run Job (no sidecar)
      # If PRODUCER_CLOUD_RUN_JOB_NAME is omitted, skip. Orchestrator can generate per-run/random job ids.
      - name: Create/replace Producer Cloud Run Job (no sidecar)
        if: ${{ env.PRODUCER_CLOUD_RUN_JOB_NAME != '' }}
        shell: bash
        env:
          PRODUCER_IMG: ${{ steps.producer_image.outputs.PRODUCER_IMAGE_URI }}
          PRODUCER_JOB_SA_EMAIL: ${{ vars.PRODUCER_JOB_SA_EMAIL }}
          CLOUD_RUN_RUNTIME_SA: ${{ env.CLOUD_RUN_RUNTIME_SA }}
        run: |
          set -euo pipefail
          : "${PRODUCER_IMG:?missing}"
          : "${PUBSUB_TOPIC:?Set repo var PUBSUB_TOPIC}"
          SA_EMAIL="${PRODUCER_JOB_SA_EMAIL:-$CLOUD_RUN_RUNTIME_SA}"

          sed -e "s|__JOB_NAME__|${PRODUCER_CLOUD_RUN_JOB_NAME}|g" \
              -e "s|__SERVICE_ACCOUNT__|${SA_EMAIL}|g" \
              -e "s|__PRODUCER_IMAGE__|${PRODUCER_IMG}|g" \
              -e "s|__TOPIC__|${PUBSUB_TOPIC}|g" \
              cloud/producer/job.yaml > /tmp/producer.job.rendered.yaml

          gcloud run jobs replace /tmp/producer.job.rendered.yaml --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}"

      # Create/replace Consumer Cloud Run Job (Pub/Sub only)
      # If CONSUMER_CLOUD_RUN_JOB_NAME is omitted, skip. Orchestrator can generate per-run/random job ids.
      - name: Create/replace Consumer Cloud Run Job (Pub/Sub only)
        if: ${{ env.CONSUMER_CLOUD_RUN_JOB_NAME != '' }}
        shell: bash
        env:
          CONSUMER_IMG: ${{ steps.consumer_images.outputs.CONSUMER_IMAGE_URI }}
          CONSUMER_JOB_SA_EMAIL: ${{ vars.CONSUMER_JOB_SA_EMAIL }}
          CLOUD_RUN_RUNTIME_SA: ${{ env.CLOUD_RUN_RUNTIME_SA }}
        run: |
          set -euo pipefail
          : "${CONSUMER_IMG:?missing}"
          : "${PUBSUB_TOPIC:?Set repo var PUBSUB_TOPIC}"
          SA_EMAIL="${CONSUMER_JOB_SA_EMAIL:-$CLOUD_RUN_RUNTIME_SA}"

          sed -e "s|__JOB_NAME__|${CONSUMER_CLOUD_RUN_JOB_NAME}|g" \
              -e "s|__SERVICE_ACCOUNT__|${SA_EMAIL}|g" \
              -e "s|__CONSUMER_IMAGE__|${CONSUMER_IMG}|g" \
              -e "s|__TOPIC__|${PUBSUB_TOPIC}|g" \
              cloud/sse-consumer/job.yaml > /tmp/consumer.job.rendered.yaml

          gcloud run jobs replace /tmp/consumer.job.rendered.yaml --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}"

      # Build and push API image
      - name: Build and push image to Artifact Registry
        id: image
        run: |
          set -euo pipefail
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/app/api:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          docker build \
            --build-arg HTTP_PROXY="${HTTP_PROXY}" \
            --build-arg HTTPS_PROXY="${HTTPS_PROXY}" \
            --build-arg NO_PROXY="${NO_PROXY}" \
            -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Build common Cloud Run env vars
        id: common_env
        shell: bash
        run: |
          set -euo pipefail
          # Make the just-built consumer image available to the services (used by GKE path fallback)
          CONSUMER_IMAGE_URI="${{ steps.consumer_images.outputs.CONSUMER_IMAGE_URI }}"
          CONSUMER_BROWSER_IMAGE_URI="${{ steps.consumer_images.outputs.BROWSER_IMAGE_URI }}"
          CONSUMER_SCALA_IMAGE_URI="${{ steps.consumer_images.outputs.SCALA_IMAGE_URI }}"
          # Use an alternate delimiter (;) to avoid escaping commas inside values (e.g., CORS_ALLOW_ORIGIN)
          BASE_ENV_VARS="NODE_ENV=production;GCP_PROJECT=${GCP_PROJECT_ID};ALLOW_SKIP_AUTH=0;WORKFLOWS_BASE_URL=${WORKFLOWS_BASE_URL};GCS_BUCKET=${GCS_BUCKET};PUBSUB_TOPIC=${PUBSUB_TOPIC};PRODUCER_CLOUD_RUN_JOB_NAME=${PRODUCER_CLOUD_RUN_JOB_NAME};CONSUMER_CLOUD_RUN_JOB_NAME=${CONSUMER_CLOUD_RUN_JOB_NAME};CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN};HTTP_PROXY=${HTTP_PROXY};HTTPS_PROXY=${HTTPS_PROXY};NO_PROXY=${NO_PROXY};CONSUMER_K8S_IMAGE=${CONSUMER_IMAGE_URI};CONSUMER_BROWSER_K8S_IMAGE=${CONSUMER_BROWSER_IMAGE_URI};CONSUMER_SCALA_K8S_IMAGE=${CONSUMER_SCALA_IMAGE_URI}"

          JSON_FILE=".github/actions-variables.json"
          if [[ -f "$JSON_FILE" ]]; then
            # Build key=value;key=value ... from JSON. Values are treated as strings.
            JSON_ENV_VARS=$(jq -r '[to_entries[] | "\(.key)=\(.value|tostring)"] | join(";")' "$JSON_FILE")
          else
            JSON_ENV_VARS=""
          fi

          if [[ -n "$JSON_ENV_VARS" ]]; then
            COMMON_ENV_VARS="${BASE_ENV_VARS};${JSON_ENV_VARS}"
          else
            COMMON_ENV_VARS="${BASE_ENV_VARS}"
          fi

          COMMON_ENV_VARS="${COMMON_ENV_VARS};MCP_OWNER_UID=${MCP_OWNER_UID}"
          COMMON_ENV_VARS="${COMMON_ENV_VARS};GOOGLE_CLOUD_OAUTH_CLIENT_ID=${GOOGLE_CLOUD_OAUTH_CLIENT_ID}"
          echo "COMMON_ENV_VARS=${COMMON_ENV_VARS}" >> "$GITHUB_OUTPUT"

      - name: Deploy API service (public)
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_API_SERVICE}" \
            --quiet \
            --region="${GCP_REGION}" \
            --image="${{ steps.image.outputs.IMAGE_URI }}" \
            --service-account="${CLOUD_RUN_RUNTIME_SA}" \
            --allow-unauthenticated \
            --timeout=3600 \
            --set-env-vars="^;^${{ steps.common_env.outputs.COMMON_ENV_VARS }};SERVICE_TARGET=start:api" \
            ${{ steps.secrets.outputs.SECRET_FLAGS }}
          # A zero-traffic tagged canary changes Cloud Run's persisted traffic
          # targets. Without explicitly promoting the new stable revision,
          # gcloud run deploy may create a revision that serves 0% indefinitely.
          # --to-latest preserves tagged canary URLs with 0% default traffic.
          gcloud run services update-traffic "${CLOUD_RUN_API_SERVICE}" \
            --region="${GCP_REGION}" --to-latest --quiet

      - name: Deploy Jobs service (auth-required)
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_JOBS_SERVICE}" \
            --quiet \
            --region="${GCP_REGION}" \
            --image="${{ steps.image.outputs.IMAGE_URI }}" \
            --service-account="${CLOUD_RUN_RUNTIME_SA}" \
            --no-allow-unauthenticated \
            --timeout=3600 \
            --set-env-vars="^;^${{ steps.common_env.outputs.COMMON_ENV_VARS }};SERVICE_TARGET=start:jobs;CLOUD_RUN_LOCATION=${GCP_REGION}" \
            ${{ steps.secrets.outputs.SECRET_FLAGS }}
          gcloud run services update-traffic "${CLOUD_RUN_JOBS_SERVICE}" \
            --region="${GCP_REGION}" --to-latest --quiet

      # No GKE provisioning in the application deployment pipeline.
      - name: Verify both services route 100% to the latest stable revision
        run: |
          set -euo pipefail
          for service in "${CLOUD_RUN_API_SERVICE}" "${CLOUD_RUN_JOBS_SERVICE}"; do
            gcloud run services describe "${service}" --region="${GCP_REGION}" --format=json |
              jq -e --arg service "${service}" '
                .status.latestReadyRevisionName as $latest |
                any(.status.traffic[]; .revisionName == $latest and .percent == 100)
              ' >/dev/null || {
                echo "Service ${service} is not serving the latest revision at 100%" >&2
                exit 1
              }
            echo "Service ${service} serves its latest revision at 100%"
          done

      - name: Verify deployed MCP route rejects anonymous requests
        run: |
          node --input-type=module -e "
            const response = await fetch('https://api.awfl.us/mcp', { method: 'POST' });
            if (response.status !== 401) {
              throw new Error('Expected MCP authentication rejection (401), got ' + response.status);
            }
            console.log('Authenticated MCP route is deployed');
          "

# Notes:
# - Producer and Consumer can run as Cloud Run Jobs with their own service accounts.
# - Communication is Pub/Sub-only; no HTTP sidecar or direct service-to-service calls.
# - The Jobs service orchestrates per-run ephemeral Pub/Sub subscriptions and can trigger Jobs with per-run env overrides.
