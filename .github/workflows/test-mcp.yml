name: MCP protocol and consumer tests

on:
  pull_request:
    paths:
      - 'mcp/**'
      - 'agentsMcp/**'
      - 'workflows/services/executeWorkflow.js'
      - 'workflows/agents/**'
      - 'workflows/exec/**'
      - 'workflows/workflows.js'
      - 'jobs/producer/**'
      - 'jobs/providers/openai.js'
      - 'jobs/providers/openai.test.js'
      - 'workflows/events/**'
      - 'workflows/index.js'
      - 'workflows/callbacks/**'
      - 'workflows/googleCloud/**'
      - 'cloud/sse-consumer/Dockerfile'
      - 'api.server.js'
      - 'scripts/mcp-smoke.js'
      - '.github/workflows/test-mcp.yml'
      - '.github/workflows/deploy-cloud-run.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'agentsMcp/**'
      - 'workflows/services/executeWorkflow.js'
      - 'workflows/agents/**'
      - 'workflows/exec/**'
      - 'workflows/workflows.js'
      - 'jobs/producer/**'
      - 'jobs/providers/openai.js'
      - 'jobs/providers/openai.test.js'
      - 'workflows/events/**'
      - 'workflows/index.js'
      - 'workflows/callbacks/**'
      - 'workflows/googleCloud/**'
      - 'cloud/sse-consumer/Dockerfile'
      - 'api.server.js'
      - 'scripts/mcp-smoke.js'
      - '.github/workflows/test-mcp.yml'
      - '.github/workflows/deploy-cloud-run.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Validate Cloud Run deployment YAML
        run: |
          python3 -m pip install --quiet PyYAML==6.0.3
          python3 -c "import yaml; doc=yaml.safe_load(open('.github/workflows/deploy-cloud-run.yml')); assert 'build_and_deploy' in doc['jobs']"
      - run: node --test mcp/tests/*.test.js agentsMcp/tests/*.test.js jobs/producer/tests/*.test.js workflows/googleCloud/tests/*.test.js jobs/providers/openai.test.js
      - run: node --check api.server.js
      - run: node --check jobs/producer/start.js
      - run: node --check mcp/index.js
      - run: node --check agentsMcp/index.js
      - run: node --check agentsMcp/service.js
      - run: node --check mcp/service.js
      - run: node --check workflows/callbacks/index.js
      - run: node --check scripts/mcp-smoke.js
