name: API key unit tests

on:
  pull_request:
    paths:
      - 'workflows/apiKeys/**'
      - 'workflows/auth/**'
      - 'workflows/userAuth.js'
      - 'mcp/privateAuth.js'
      - '.github/workflows/api-keys-test.yml'
  push:
    branches: [main]
    paths:
      - 'workflows/apiKeys/**'
      - 'workflows/auth/**'
      - 'workflows/userAuth.js'
      - 'mcp/privateAuth.js'
      - '.github/workflows/api-keys-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test API key generation and verification rules
        run: node --test workflows/apiKeys/__tests__/core.test.mjs
      - name: Install dependencies for shared identity HTTP integration
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify shared API/MCP authentication and revocation
        run: node --test workflows/auth/sharedAuth.test.js workflows/oauth/tests/oauth.test.js
