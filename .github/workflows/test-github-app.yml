name: GitHub App connection tests
on:
  pull_request:
    paths:
      - 'workflows/githubApp/**'
      - 'workflows/gitFiles.js'
      - 'jobs/producer/credentials.js'
      - 'api.server.js'
      - 'workflows/index.js'
      - '.github/workflows/test-github-app.yml'
  push:
    branches: [main]
    paths:
      - 'workflows/githubApp/**'
      - 'workflows/gitFiles.js'
      - 'jobs/producer/credentials.js'
      - 'api.server.js'
      - 'workflows/index.js'
      - '.github/workflows/test-github-app.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --test workflows/githubApp/tests/*.test.js
      - run: node --check api.server.js
      - run: node --check workflows/gitFiles.js
      - run: node --check workflows/githubApp/index.js
