name: Diagnose AWFL domain vs direct Cloud Run (read-only)
on:
  push:
    branches:
      - diagnose/mcp-503-20261117
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/323709301334/locations/global/workloadIdentityPools/github-oidc/providers/github
          service_account: github-deployer@awfl-us.iam.gserviceaccount.com
          project_id: awfl-us
      - uses: google-github-actions/setup-gcloud@v2
      - name: Compare direct Cloud Run and custom domain response
        run: |
          set -euo pipefail
          direct="$(gcloud run services describe api --project awfl-us --region us-central1 --format='value(status.url)')"
          echo "direct_cloud_run_api_url=$direct"
          echo "custom_domain_dns:"
          getent hosts api.awfl.us || true
          for origin in "https://api.awfl.us" "$direct"; do
            for path in /health /mcp /mcp/agents; do
              if [ "$path" = /health ]; then method=GET; else method=POST; fi
              status="$(curl -k --silent --show-error --max-time 15 --request "$method" --output /tmp/resp-body --write-out '%{http_code}' "$origin$path" || true)"
              echo "$origin$path $method HTTP $status"
              echo "BODY_FIRST_200:"
              head -c 200 /tmp/resp-body | tr '\n' ' ' | tr -cd '[:print:]' || true
              echo
            done
          done
      - name: Inspect revisions and routing metadata
        run: |
          set -euo pipefail
          gcloud run services describe api --region us-central1 --project awfl-us --format='json(status.conditions,status.traffic,status.latestReadyRevisionName,status.url)' >/tmp/service.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/service.json'))['status']
          print('READY_REVISION',s.get('latestReadyRevisionName'))
          print('TRAFFIC',[(x.get('revisionName'),x.get('percent')) for x in s.get('traffic',[])])
          print('CONDITIONS',[(x.get('type'),x.get('status'),x.get('reason')) for x in s.get('conditions',[])])
          PY
          echo "Load balancer URL maps (if authorized):"
          gcloud compute url-maps list --project awfl-us --format='table(name,defaultService)' 2>&1 | head -30 || true
