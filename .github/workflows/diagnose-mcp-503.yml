name: Reconcile AWFL native worker deployment strategy
on:
  push:
    branches:
      - diagnose/mcp-503-20261117
permissions:
  contents: read
  id-token: write
jobs:
  patch_strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/323709301334/locations/global/workloadIdentityPools/github-oidc/providers/github
          service_account: github-deployer@awfl-us.iam.gserviceaccount.com
          project_id: awfl-us
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install kubectl and authenticate to GKE
        run: |
          gcloud components install kubectl gke-gcloud-auth-plugin --quiet
          gcloud container clusters get-credentials awfl-gke --region us-central1 --project awfl-us
      - name: Patch strategy only with strict pod-template integrity check
        run: |
          set -euo pipefail
          kubectl -n awfl get deployment native-jobs -o json > /tmp/before-native-jobs.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/before-native-jobs.json'))
          s=d['spec']; st=d.get('status',{})
          print('BEFORE_STRATEGY',s['strategy'])
          print('BEFORE_REPLICAS',s['replicas'],'READY',st.get('readyReplicas'),'UPDATED',st.get('updatedReplicas'),'GEN',d['metadata']['generation'],'OBSERVED',st.get('observedGeneration'))
          print('IMAGE',s['template']['spec']['containers'][0]['image'])
          env={x['name']:x.get('value') for x in s['template']['spec']['containers'][0]['env'] if x['name'] in ('AWFL_DOCUMENT_STORAGE_BACKEND','AWFL_NATIVE_DOCUMENT_STORE_ENABLED')}
          print('STORAGE_VARS',env)
          assert st.get('readyReplicas')==s['replicas'], 'would race an unhealthy deployment'
          assert st.get('updatedReplicas')==s['replicas'], 'would race an ongoing rollout'
          assert st.get('observedGeneration',0)>=d['metadata']['generation'],'deployment has outstanding generation'
          PY
          echo "PODS BEFORE:"
          kubectl -n awfl get pods -l app=awfl-native-jobs -o name | sort
          kubectl -n awfl patch deployment native-jobs --type merge -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":"1","maxUnavailable":"0"}}}}'
          kubectl -n awfl get deployment native-jobs -o json > /tmp/after-native-jobs.json
          python3 - <<'PY'
          import json
          b=json.load(open('/tmp/before-native-jobs.json'))['spec']
          a=json.load(open('/tmp/after-native-jobs.json'))['spec']
          assert a['strategy']['type']=='RollingUpdate'
          assert a['strategy']['rollingUpdate']['maxSurge']=='1'
          assert a['strategy']['rollingUpdate']['maxUnavailable']=='0'
          assert b['template']==a['template'], 'pod template changed unexpectedly'
          assert b['replicas']==a['replicas'], 'replica count changed'
          print('AFTER_STRATEGY',a['strategy'])
          print('TEMPLATE_UNCHANGED',True)
          print('STORAGE_VARS_UNCHANGED',True)
          PY
          echo "PODS AFTER:"
          kubectl -n awfl get pods -l app=awfl-native-jobs -o name | sort
